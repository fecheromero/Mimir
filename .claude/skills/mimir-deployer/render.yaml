# Render Blueprint (render.yaml)
# Alternative to manual setup: place this file in repo root
# Render will auto-detect and create all services

# ⚠️ IMPORTANT: Background Workers are NOT available on Render free tier
# This blueprint runs both FastAPI and Celery worker in a single Web Service

services:
  # Combined FastAPI + Celery Worker Service
  - type: web
    name: mimir-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: ./start.sh
    envVars:
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false  # Must be set manually in dashboard
      - key: REDIS_URL
        fromService:
          type: redis
          name: mimir-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: mimir-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: mimir-redis
          property: connectionString
      - key: BROWSER_EXECUTION_MODE
        value: cloud
      - key: BROWSER_USE_API_KEY
        sync: false  # Must be set manually
      - key: JOB_RETENTION_HOURS
        value: 24
      - key: TEST_CASE_AGENT_MODEL
        value: claude-sonnet-4-5-20250929
      - key: QA_AGENT_MODEL
        value: claude-sonnet-4-5-20250929

  # ⚠️ Background Workers removed - not available on free tier
  # Celery worker runs inside the web service above via start.sh

databases:
  # Redis for Celery + Job Storage
  - name: mimir-redis
    region: oregon
    plan: free
    ipAllowList: []  # Allow from all Render services
