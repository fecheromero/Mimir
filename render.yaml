# Render Blueprint (render.yaml)
# Alternative to manual setup: place this file in repo root
# Render will auto-detect and create all services

services:
  # FastAPI Web Service
  - type: web
    name: mimir-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false  # Must be set manually in dashboard
      - key: REDIS_URL
        fromService:
          type: redis
          name: mimir-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: mimir-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: mimir-redis
          property: connectionString
      - key: BROWSER_EXECUTION_MODE
        value: cloud
      - key: BROWSER_USE_API_KEY
        sync: false  # Must be set manually
      - key: JOB_RETENTION_HOURS
        value: 24
      - key: TEST_CASE_AGENT_MODEL
        value: claude-sonnet-4-5-20250929
      - key: QA_AGENT_MODEL
        value: claude-sonnet-4-5-20250929

  # Celery Worker
  - type: worker
    name: mimir-worker
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: celery -A app.core.celery_app worker --loglevel=info
    envVars:
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: mimir-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: mimir-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: mimir-redis
          property: connectionString
      - key: BROWSER_EXECUTION_MODE
        value: cloud
      - key: BROWSER_USE_API_KEY
        sync: false
      - key: JOB_RETENTION_HOURS
        value: 24

  # Celery Beat (Optional)
  - type: worker
    name: mimir-beat
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.core.celery_app beat --loglevel=info
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: mimir-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: mimir-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: mimir-redis
          property: connectionString

databases:
  # Redis for Celery + Job Storage
  - name: mimir-redis
    region: oregon
    plan: free
    ipAllowList: []  # Allow from all Render services
