<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logotipo Mimir</title>
    <!-- Cargamos una fuente monoespaciada moderna de Google Fonts para la marca -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f1f5f9; /* Fondo gris muy claro para contrastar */
            font-family: sans-serif;
        }
        /* El contenedor del SVG actuará como nuestro "lienzo" */
        .logo-container {
            width: 100%;
            max-width: 500px;
            background-color: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
            padding: 20px;
            box-sizing: border-box;
        }
        svg {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- SVG Vectorial y Escalable -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
            <defs>
                <!-- Máscara circular para dar forma de "Insignia" o pozo -->
                <clipPath id="circleClip">
                    <circle cx="250" cy="190" r="140" />
                </clipPath>

                <!-- Degradado para el agua del estanque (Cyan a Azul profundo) -->
                <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#0ea5e9" />
                    <stop offset="100%" stop-color="#0284c7" />
                </linearGradient>

                <!-- Degradado para el fondo / cielo nocturno (Gris oscuro a Azul noche) -->
                <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#0f172a" />
                        <stop offset="100%" stop-color="#1e293b" />
                </linearGradient>
            </defs>

            <!-- Borde decorativo de la insignia -->
            <circle cx="250" cy="190" r="145" fill="#e2e8f0" />

            <!-- Contenido agrupado y cortado en forma de círculo -->
            <g clip-path="url(#circleClip)">

                <!-- Fondo: Noche / Sabiduría -->
                <rect x="0" y="0" width="500" height="240" fill="url(#skyGrad)" />

                <!-- Pelo: Fondo oscuro para dar volumen -->
                <path d="M 120,230 C 130,100 180,60 250,60 C 320,60 370,100 380,230 Z" fill="#1e293b" />

                <!-- Pelo: Mechones fluyendo a los lados y sobre el agua -->
                <path d="M 250,60 C 190,60 140,110 120,180 C 110,210 80,215 50,220 L 140,220 C 150,160 180,100 250,85 Z" fill="#334155" />
                <path d="M 250,60 C 310,60 360,110 380,180 C 390,210 420,215 450,220 L 360,220 C 350,160 320,100 250,85 Z" fill="#334155" />

                <!-- Pelo: Textura de hebras individuales -->
                <path d="M 230,65 C 180,90 150,150 135,220" stroke="#475569" stroke-width="2.5" fill="none" />
                <path d="M 210,75 C 170,110 160,170 150,220" stroke="#475569" stroke-width="2" fill="none" />
                <path d="M 270,65 C 320,90 350,150 365,220" stroke="#475569" stroke-width="2.5" fill="none" />
                <path d="M 290,75 C 330,110 340,170 350,220" stroke="#475569" stroke-width="2" fill="none" />

                <!-- Forma base del rostro (más estructurada) -->
                <path d="M 175,220 L 175,160 C 175,100 210,80 250,80 C 290,80 325,100 325,160 L 325,220 Z" fill="#f8fafc" />

                <!-- Definición de pómulos/mandíbula superior -->
                <path d="M 175,160 Q 195,180 195,220" stroke="#e2e8f0" stroke-width="3" fill="none" />
                <path d="M 325,160 Q 305,180 305,220" stroke="#e2e8f0" stroke-width="3" fill="none" />

                <!-- Arrugas de la frente (Sabiduría) -->
                <path d="M 220,115 Q 250,120 280,115 M 230,105 Q 250,110 270,105 M 225,125 Q 250,130 275,125" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round" />

                <!-- Cejas tupidas -->
                <path d="M 195,155 Q 215,145 235,150 M 305,155 Q 285,145 265,150" stroke="#64748b" stroke-width="6" fill="none" stroke-linecap="round" />

                <!-- Ojos cerrados anatómicamente normales -->
                <path d="M 200,175 Q 215,185 230,175 M 300,175 Q 285,185 270,175" stroke="#0f172a" stroke-width="3.5" fill="none" stroke-linecap="round" />

                <!-- Nariz -->
                <path d="M 240,150 Q 235,180 230,210 M 260,150 Q 265,180 270,210" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round" />
                <path d="M 230,210 Q 250,225 270,210" stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linecap="round" />

                <!-- Agua del Estanque de Mímir -->
                <!-- Ahora la línea del agua corta a la altura de las fosas nasales (y=220) -->
                <rect x="0" y="220" width="500" height="200" fill="url(#waterGrad)" />

                <!-- Reflejo sutil de la cara bajo el agua -->
                <path d="M 175,220 C 175,320 325,320 325,220 Z" fill="#ffffff" opacity="0.1" />

                <!-- Ondas del agua rompiendo contra el rostro -->
                <path d="M 50,220 Q 250,225 450,220" stroke="#bae6fd" stroke-width="4" fill="none" />
                <path d="M 100,235 Q 250,240 400,235" stroke="#7dd3fc" stroke-width="2" fill="none" opacity="0.6" />

            </g>

            <!-- Tipografía principal de la App -->
            <text x="250" y="415" font-family="'Fira Code', monospace" font-size="56" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="14">MIMIR</text>

            <!-- Subtítulo / Tagline -->
            <text x="250" y="450" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="6">DEV TOOLS</text>

        </svg>
    </div>

</body>
</html>
